      ansible.builtin.set_fact:
        cis_sshd_main_file: '{{ (cis_sshd_policy_files | selectattr(''aliases'', ''contains'', cis_sshd_config_file
          | default(''/etc/ssh/sshd_config'')) | first).path }}'
    - name: 5.1.20 | Validate existing SSH configuration before changes
      ansible.builtin.command:
        argv:
        - /usr/sbin/sshd
        - -t
        - -f
        - '{{ cis_sshd_main_file }}'
      changed_when: false
      check_mode: false
    - name: 5.1.20 | Normalize root-login settings in included files
      ansible.builtin.replace:
        path: '{{ item.path }}'
        regexp: (?im)^([ \t]*PermitRootLogin[ \t=]+)\S+([^\r\n]*)$
        replace: \g<1>no\g<2>
        backup: false
      loop: '{{ cis_sshd_policy_files }}'
      loop_control:
        label: '{{ item.path }}'
      when: item.path != cis_sshd_main_file
      register: cis_sshd_root_include_changes
    - name: 5.1.20 | Read main SSH configuration
      ansible.builtin.slurp:
        src: '{{ cis_sshd_main_file }}'
      register: cis_sshd_main_content
      no_log: true
    - name: 5.1.20 | Build a single global root-login directive
      ansible.builtin.set_fact:
        cis_sshd_root_expected: |-
          PermitRootLogin no
          {{ (cis_sshd_main_content.content | b64decode) | regex_replace('(?im)^[ \t]*PermitRootLogin[ \t=]+[^\r\n]*(?:\r?\n|$)', '') }}
      no_log: true
    - name: 5.1.20 | Write canonical SSH root-login configuration
      ansible.builtin.copy:
        dest: '{{ cis_sshd_main_file }}'
        content: '{{ cis_sshd_root_expected }}'
        backup: false
        validate: /usr/sbin/sshd -t -f %s
      register: cis_sshd_root_main_change
    - name: 5.1.20 | Verify complete SSH configuration syntax
      ansible.builtin.command:
        argv:
        - /usr/sbin/sshd
        - -t
        - -f
        - '{{ cis_sshd_main_file }}'
      changed_when: false
      check_mode: false
    - name: 5.1.20 | Read effective global root-login policy
      ansible.builtin.command:
        argv:
        - /usr/sbin/sshd
        - -T
        - -f
        - '{{ cis_sshd_main_file }}'
      changed_when: false
      check_mode: false
      register: cis_sshd_root_global_policy
    - name: 5.1.20 | Read effective root connection policy
      ansible.builtin.command:
        argv:
        - /usr/sbin/sshd
        - -T
        - -f
        - '{{ cis_sshd_main_file }}'
        - -C
        - user=root,host=localhost,addr=127.0.0.1,laddr=127.0.0.1,lport={{ ansible_port | default(22) }}
      changed_when: false
      check_mode: false
      register: cis_sshd_root_connection_policy
    - name: 5.1.20 | Require effective root login to be disabled
      ansible.builtin.assert:
        that:
        - '''permitrootlogin no'' in cis_sshd_root_global_policy.stdout_lines'
        - '''permitrootlogin no'' in cis_sshd_root_connection_policy.stdout_lines'
        fail_msg: Effective SSH root login is not disabled. Review Include/Match settings; sshd was not reloaded.
      when: not ansible_check_mode
    - name: 5.1.20 | Reload SSH only after verified configuration changes
      ansible.builtin.systemd_service:
        name: sshd
        state: reloaded
      when:
      - not ansible_check_mode
      - cis_sshd_root_main_change.changed or (cis_sshd_root_include_changes.results | selectattr('changed', 'equalto',
        true) | list | length > 0)
