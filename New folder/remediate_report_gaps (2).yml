        cis_backup_absent_paths: "{{ cis_backup_transaction.absent | default([]) }}"
    when:
    - not ansible_check_mode
    - cis_backup_transaction_ready | default(false) | bool
    tags:
    - cis_backup_prepare
  - name: Load collection rule reset values
    ansible.builtin.include_vars:
      file: '{{ role_path }}/vars/disable_all.yml'
      name: cis_rule_reset_map
  - name: Reset collection rules at fact precedence
