        ansible.builtin.command:
          argv: '{{ [''authselect'', ''select'', cis_nullok_expected_profile] + cis_nullok_selection.stdout.split()[1:]
            }}'
        changed_when: true
    - name: 5.3.3.4.1 | Inspect custom template file types
      ansible.builtin.stat:
