  - name: 5.1.20 | Disable SSH root login across the active configuration tree
    when: '''5.1.20'' in cis_custom_remediation_ids'
    become: true
    block:
    - name: 5.1.20 | Identify snapshotted SSH configuration files
      ansible.builtin.set_fact:
        cis_sshd_policy_files: '{{ cis_prechange_backup_plan.stdout | from_json | selectattr(''control_ids'', ''contains'',
          ''5.1.20'') | list }}'
