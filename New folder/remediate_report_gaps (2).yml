  - name: Apply pending CIS collection handlers before post-validation
    ansible.builtin.meta: flush_handlers
  - name: Retain only changed-file backups and remove unchanged snapshots
    become: true
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - |
        import base64,hashlib,json,os,shutil,stat,subprocess,sys,tempfile
        from datetime import datetime,timezone

        def fingerprint(path):
            try:info=os.stat(path)
            except FileNotFoundError:return None
            if not stat.S_ISREG(info.st_mode):raise ValueError('Expected a regular file: '+path)
            digest=hashlib.sha256()
            with open(path,'rb') as stream:
                for part in iter(lambda:stream.read(1024*1024),b''):digest.update(part)
            attrs=[[key,base64.b64encode(os.getxattr(path,key)).decode()] for key in sorted(os.listxattr(path))]
            return [digest.hexdigest(),stat.S_IMODE(info.st_mode),info.st_uid,info.st_gid,info.st_mtime_ns,attrs]

        records=[];entries=[]
        retained={entry['original_file']:entry for entry in json.loads(os.environ['CIS_RUN_FILE_BACKUPS'])}
        for item in json.loads(os.environ['CIS_BACKUP_PLAN']):
            if item['path'] in retained:
                record=dict(retained[item['path']])
                record['backup_status']='BACKUP_REUSED' if record.get('backup_file') else 'NEW_FILE_NO_ORIGINAL'
                # Scope this event to the controls in this transaction. The
                # original creation provenance is stored separately.
                record['control_ids']=item['control_ids']
                record['original_aliases']=sorted(set(record.get('original_aliases',[])+item.get('aliases',[])))
                records.append(record)
        try:
            entries=json.loads(os.environ['CIS_BACKUP_TRANSACTION'])['entries']
            for entry in entries:
                path=entry['path'];after=fingerprint(path)
                snapshot=entry['snapshot'];destination=entry['destination']
                published=os.path.lexists(destination)
                if published:
                    if not stat.S_ISREG(os.lstat(destination).st_mode):raise ValueError('Backup destination is not a regular file: '+destination)
                    # Permit retry after partial finalization, never overwrite another backup.
                    if os.path.exists(snapshot):
                        if not os.path.samefile(snapshot,destination):raise ValueError('Backup path already exists: '+destination)
                    elif fingerprint(destination)[0]!=entry['before'][0]:
                        raise ValueError('Previously retained backup is inconsistent: '+destination)
                if after==entry['before'] and not published:continue
                if not published:
                    fd=os.open(snapshot,os.O_RDONLY|os.O_NOFOLLOW)
                    try:
                        info=os.fstat(fd)
                        if not stat.S_ISREG(info.st_mode) or info.st_nlink!=1:
                            raise ValueError('Pre-change snapshot is not an independent regular file: '+snapshot)
                        digest=hashlib.sha256()
                        while True:
                            part=os.read(fd,1024*1024)
                            if not part:break
                            digest.update(part)
                        if digest.hexdigest()!=entry['before'][0]:
                            raise ValueError('Pre-change snapshot contents changed: '+snapshot)
                        # Change permissions through the verified descriptor, never a followed link.
                        os.fchown(fd,os.geteuid(),os.getegid());os.fchmod(fd,0o600)
                        os.link(snapshot,destination,follow_symlinks=False)
                        retained=os.lstat(destination)
                        if (retained.st_dev,retained.st_ino)!=(info.st_dev,info.st_ino):
                            raise ValueError('Snapshot changed while publishing backup: '+snapshot)
                    finally:
                        os.close(fd)
                records.append(dict(original_file=path,changed_file=path,backup_file=destination,
                                    change_type='deleted' if after is None else 'modified',
                                    backup_status='BACKUP_CREATED',
                                    backup_created_control_ids=entry['control_ids'],
                                    control_ids=entry['control_ids'],original_aliases=entry.get('aliases',[])))
            for item in json.loads(os.environ['CIS_BACKUP_TRANSACTION']).get('absent',[]):
                path=item['path']
                # A missing target that becomes a directory is not a file backup.
                if os.path.isfile(path):
                    records.append(dict(original_file=path,changed_file=path,backup_file=None,
                                        change_type='created',backup_status='NEW_FILE_NO_ORIGINAL',
                                        control_ids=item['control_ids'],original_aliases=item.get('aliases',[])))
            # Clean up only after all changed files have verified retained backups.
            for entry in entries:
                if os.path.isdir(entry['directory']):shutil.rmtree(entry['directory'])
            print(json.dumps({'cis_changed_file_backups':True,'file_backups':records,'error':None,'control_ids':sorted({c for item in json.loads(os.environ['CIS_BACKUP_PLAN']) for c in item['control_ids']})}))
        except (OSError,ValueError,KeyError) as error:
            recovery=[entry['directory'] for entry in entries if os.path.isdir(entry['directory'])]
            print(json.dumps({'cis_changed_file_backups':True,'file_backups':records,
                              'error':str(error),'recovery_snapshot_dirs':recovery,'control_ids':sorted({c for item in json.loads(os.environ['CIS_BACKUP_PLAN']) for c in item['control_ids']})}))
            sys.exit(2)
    environment:
      CIS_BACKUP_TRANSACTION: '{{ cis_backup_transaction | to_json }}'
      CIS_RUN_FILE_BACKUPS: '{{ cis_run_file_backups | default([]) | to_json }}'
      CIS_BACKUP_PLAN: '{{ cis_prechange_backup_plan.stdout }}'
    register: cis_backup_finish_result
    changed_when: >-
      ((cis_backup_finish_result.stdout | default('{}', true) | from_json).get('file_backups', [])
       | selectattr('backup_status', 'equalto', 'BACKUP_CREATED') | list | length) > 0
    when:
    - not ansible_check_mode
    - cis_backup_transaction_ready | default(false) | bool
    tags:
    - cis_changed_file_backups
  - name: Remember original backups across all controls in this run
    ansible.builtin.set_fact:
      cis_run_file_backups: >-
        {{ ((cis_run_file_backups | default([])
             | rejectattr('original_file', 'in', cis_finished_backup_paths) | list)
             + cis_finished_backup_records) }}
    vars:
      cis_finished_backup_records: "{{ (cis_backup_finish_result.stdout | default('{}', true) | from_json).get('file_backups', []) }}"
      cis_finished_backup_paths: "{{ cis_finished_backup_records | map(attribute='original_file') | list }}"
    when:
    - not ansible_check_mode
    - cis_backup_transaction_ready | default(false) | bool
