            selected=set(custom_ids+collection_ids)
            targets=collections.defaultdict(set);aliases=collections.defaultdict(set)
            def excluded(path):
                path=os.path.normpath(path)
                if any(path == root or path.startswith(root+'/') for root in ('/tmp','/var/tmp','/dev/shm','/run','/var/run')):return True
                return any(fnmatch.fnmatch(part,pattern) for part in pathlib.Path(path).parts
                           for pattern in ('backup_CIS_remediation_*','*-backup_CIS_remediation_*',
                                           '.cis_prechange_*','ansible-tmp-*','.ansible*','*.tmp','*.temp',
                                           '*.swp','*.swo','.#*','*~'))
            def add(path,control):
                if not os.path.isabs(path):raise ValueError('Backup target must be absolute: '+path)
                if excluded(path):return
                name=os.path.basename(path)
                if name.startswith(('backup_CIS_remediation_','.cis_prechange_')) or '-backup_CIS_remediation_' in name:return
                # Back up the real file beside its physical target, never a directory or device.
                alias=path;path=os.path.realpath(path)
                if excluded(path):return
                try:info=os.stat(path)
                except FileNotFoundError:
                    targets[path].add(control);aliases[path].add(alias)
                    return
                if stat.S_ISREG(info.st_mode):
                    targets[path].add(control);aliases[path].add(alias)
            def patterns(values,control):
                for pattern in values:
                    if glob.has_magic(pattern):
                        for path in glob.glob(pattern,recursive=True):add(path,control)
                    else:
                        add(pattern,control)
            for kind,ids in [('custom',custom_ids),('collection',collection_ids)]:
                for control in ids:patterns(maps[kind].get(control,[]),control)
            if '5.1.20' in custom_ids:
                # SSH Include paths are relative to /etc/ssh, including nested Includes.
                todo=[config.get('sshd_config_file','/etc/ssh/sshd_config')];seen=set()
                base=config.get('sshd_config_dir','/etc/ssh')
                while todo:
                    path=todo.pop()
                    if not os.path.isabs(path):raise ValueError('sshd configuration path must be absolute')
                    physical=os.path.realpath(path)
                    if physical in seen:continue
                    seen.add(physical)
                    if not os.path.isfile(physical):raise ValueError('sshd configuration missing: '+path)
                    add(path,'5.1.20')
                    for line in pathlib.Path(physical).read_text().splitlines():
                        match=re.match(r'^[ \t]*Include(?:[ \t]+|[ \t]*=[ \t]*)(.*)$',line,re.I)
                        if not match:continue
                        for pattern in shlex.split(match.group(1),comments=True):
                            if not os.path.isabs(pattern):pattern=os.path.join(base,pattern)
                            todo.extend(sorted(glob.glob(pattern)))
            pam={'5.3.2.1','5.3.2.2','5.3.2.4','5.3.3.3.3','5.3.3.4.1'} & selected
            if pam:
                result=subprocess.run(['authselect','current','--raw'],capture_output=True,text=True,timeout=30)
                if result.returncode:raise ValueError('Cannot identify active authselect profile for backup: '+result.stderr.strip())
                tokens=result.stdout.split()
                if not tokens:raise ValueError('No active authselect profile returned for backup')
                profile=tokens[0]
                if '/' in profile and not profile.startswith('custom/'):raise ValueError('Unsupported authselect profile path')
                if '..' in profile or profile.startswith('/'):raise ValueError('Unsafe authselect profile path')
                files=['/etc/authselect/authselect.conf','/etc/authselect/system-auth','/etc/authselect/password-auth',
                       '/etc/authselect/fingerprint-auth','/etc/authselect/smartcard-auth','/etc/authselect/postlogin',
                       '/etc/authselect/nsswitch.conf','/etc/authselect/user-nsswitch.conf',
                       '/etc/authselect/dconf-db','/etc/authselect/dconf-locks','/etc/nsswitch.conf',
                       '/etc/pam.d/system-auth','/etc/pam.d/password-auth','/etc/pam.d/fingerprint-auth',
                       '/etc/pam.d/smartcard-auth','/etc/pam.d/postlogin',
                       '/etc/dconf/db/distro','/etc/dconf/db/distro.d/20-authselect',
                       '/etc/dconf/db/distro.d/locks/20-authselect']
                if profile.startswith('custom/'):
                    files += ['/etc/authselect/'+profile+'/system-auth','/etc/authselect/'+profile+'/password-auth']
                for control in pam:patterns(files,control)
            if '1.2.1.4' in custom_ids:
                for repository in config.get('repositories',[]):
                    add('/etc/yum.repos.d/'+repository['id']+'.repo','1.2.1.4')
            if '6.1.2' in collection_ids:
                cron=config.get('aide_cron_file','aide')
                add(cron if cron.startswith('/') else '/etc/cron.d/'+cron,'6.1.2')
            if '7.1.12' in custom_ids:
                for entry in config.get('unowned_paths',[]):
                    path=entry['path'];add(path,'7.1.12')
                    if entry.get('recurse') and os.path.isdir(path):
                        for directory,dirs,files in os.walk(path,followlinks=False):
                            dirs[:]=[d for d in dirs if not d.startswith('.cis_prechange_')]
                            for name in files:add(os.path.join(directory,name),'7.1.12')
            if '7.2.9' in selected:
                shells={line.strip() for line in pathlib.Path('/etc/shells').read_text().splitlines()
                        if line.startswith('/') and os.path.basename(line.strip())!='nologin'}
                for line in pathlib.Path('/etc/passwd').read_text().splitlines():
                    fields=line.split(':')
                    if len(fields)!=7 or fields[6] not in shells or not os.path.isdir(fields[5]):continue
                    home=fields[5];device=os.stat(home).st_dev
                    def walk_error(error):raise error
                    for directory,dirs,files in os.walk(home,followlinks=False,onerror=walk_error):
                        dirs[:]=[d for d in dirs if os.lstat(os.path.join(directory,d)).st_dev==device]
                        for name in files:
                            path=os.path.join(directory,name)
                            if name.startswith('.') and not os.path.islink(path):add(path,'7.2.9')
            if '7.1.11' in selected:
                roots=['/']
                if '7.1.11' in custom_ids:
                    result=subprocess.run(['findmnt','-rn','-t','ext2,ext3,ext4,xfs,btrfs','-o','TARGET'],capture_output=True,text=True)
                    if result.returncode:raise ValueError('Cannot discover local mounts for file backups')
                    roots=result.stdout.splitlines()
                for base in roots:
                    result=subprocess.run(['find',base,'-xdev']+['(', '-type', 'd', '-name', '.cis_prechange_*', ')', '-prune', '-o', '(', '-name', 'backup_CIS_remediation_*', '-o', '-name', '*-backup_CIS_remediation_*', ')', '-prune', '-o']+['-type','f','-perm','-0002','-print0'],capture_output=True)
                    if result.returncode:raise ValueError('Cannot identify world-writable files for backup: '+os.fsdecode(result.stderr))
                    for path in result.stdout.split(b'\0'):
                        if path:add(os.fsdecode(path),'7.1.11')
            # Optional site-specific configuration paths, without modifying the collection.
            for control,paths in config.get('extra_paths',{}).items():
                if control in selected:patterns(paths,control)
            print(json.dumps([{'path':path,'control_ids':sorted(ids),'aliases':sorted(aliases[path])} for path,ids in sorted(targets.items())]))
        except (OSError,ValueError,subprocess.TimeoutExpired) as error:
            print('Cannot plan pre-remediation file backups: '+str(error),file=sys.stderr)
            sys.exit(2)
    environment:
      CIS_BACKUP_CUSTOM_IDS: '{{ cis_custom_remediation_ids | default([]) | to_json }}'
      CIS_BACKUP_COLLECTION_IDS: '{{ cis_collection_remediation_ids | default([]) | to_json }}'
      CIS_BACKUP_CONFIG: '{{ {''sshd_config_file'': cis_sshd_config_file | default(''/etc/ssh/sshd_config''), ''sshd_config_dir'':
        cis_sshd_config_dir | default(''/etc/ssh''), ''unowned_paths'': cis_unowned_path_ownership | default([]),
        ''aide_cron_file'': rhel9cis_aide_cron_file | default(''aide''), ''repositories'': cis_repository_definitions
        | default([]), ''extra_paths'': cis_backup_extra_paths_by_control | default({})} | to_json }}'
    tags:
    - cis_backup_prepare
    register: cis_prechange_backup_plan
    changed_when: false
    check_mode: false
  - name: Prepare private pre-change file snapshots
    become: true
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - |
        import base64,hashlib,json,os,shutil,stat,subprocess,sys,tempfile
        from datetime import datetime,timezone

        def fingerprint(path):
            try:info=os.stat(path)
            except FileNotFoundError:return None
            if not stat.S_ISREG(info.st_mode):raise ValueError('Expected a regular file: '+path)
            digest=hashlib.sha256()
            with open(path,'rb') as stream:
                for part in iter(lambda:stream.read(1024*1024),b''):digest.update(part)
            attrs=[[key,base64.b64encode(os.getxattr(path,key)).decode()] for key in sorted(os.listxattr(path))]
            return [digest.hexdigest(),stat.S_IMODE(info.st_mode),info.st_uid,info.st_gid,info.st_mtime_ns,attrs]

        entries=[];absent=[]
        try:
            stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
            retained={entry['original_file']:entry for entry in json.loads(os.environ['CIS_RUN_FILE_BACKUPS'])}
            for item in json.loads(os.environ['CIS_BACKUP_PLAN']):
                path=item['path']
                if path in retained:
                    prior=retained[path]
                    if prior.get('backup_file'):
                        if not os.path.isfile(prior['backup_file']):
                            raise ValueError('Original backup is missing: '+prior['backup_file'])
                    elif prior.get('change_type')!='created':
                        raise ValueError('Invalid original-file ledger entry: '+path)
                    continue
                before=fingerprint(path)
                if before is None:
                    absent.append(item)
                    continue
                directory=tempfile.mkdtemp(prefix='.cis_prechange_'+stamp+'_',dir=os.path.dirname(path))
                os.chmod(directory,0o700)
                name='backup_CIS_remediation_'+os.path.basename(path)+'_'+stamp+'.bak'
                entry=dict(item,before=before,directory=directory,snapshot=os.path.join(directory,name),
                           destination=os.path.join(os.path.dirname(path),name))
                entries.append(entry)
                # Anchor writes to a private directory descriptor; never follow a replaced snapshot link.
                directory_fd=os.open(directory,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
                try:
                    source_fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
                    with os.fdopen(source_fd,'rb') as source:
                        source_info=os.fstat(source.fileno())
                        if not stat.S_ISREG(source_info.st_mode):raise ValueError('Snapshot source is not a regular file: '+path)
                        target_fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600,dir_fd=directory_fd)
                        with os.fdopen(target_fd,'wb') as target:
                            shutil.copyfileobj(source,target)
                            target.flush()
                            os.fchown(target.fileno(),before[2],before[3]);os.fchmod(target.fileno(),before[1])
                            attributes={key:base64.b64decode(value) for key,value in before[5]}
                            for key in os.listxattr(target.fileno()):
                                if key not in attributes:os.removexattr(target.fileno(),key)
                            for key,value in attributes.items():os.setxattr(target.fileno(),key,value)
                            os.utime(target.fileno(),ns=(source_info.st_atime_ns,before[4]))
                finally:
                    os.close(directory_fd)
                if fingerprint(path)!=before or fingerprint(entry['snapshot'])!=before:
                    raise ValueError('Snapshot mismatch or concurrent file change: '+path)
            print(json.dumps({'entries':entries,'absent':absent}))
        except (OSError,ValueError) as error:
            for entry in entries:
                shutil.rmtree(entry['directory'],ignore_errors=True)
            print('Cannot prepare pre-change snapshots: '+str(error),file=sys.stderr)
            sys.exit(2)
    environment:
      CIS_BACKUP_PLAN: '{{ cis_prechange_backup_plan.stdout }}'
      CIS_RUN_FILE_BACKUPS: '{{ cis_run_file_backups | default([]) | to_json }}'
    register: cis_backup_prepare_result
    changed_when: false
    when: not ansible_check_mode
    tags:
    - cis_backup_prepare
  - name: Save prepared backup transaction
    ansible.builtin.set_fact:
      cis_backup_transaction: '{{ cis_backup_prepare_result.stdout | from_json }}'
      cis_backup_transaction_ready: true
    when: not ansible_check_mode
  - name: Report paths absent before tracked remediation
    ansible.builtin.debug:
