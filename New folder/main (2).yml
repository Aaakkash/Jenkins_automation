- name: Initialize host-level recovery reporting
  ansible.builtin.set_fact:
    cis_msb_status: '{{ ''COMPLETED'' if cis_msb_post_remediation_done | default(false) | bool else ''NOT_RUN''
      }}'
    cis_msb_output: '{{ cis_msb_output | default(''MSB workflow has not run in this execution.'') }}'
    cis_msb_backup_details: '{{ cis_msb_backup_details | default('''') }}'
  tags:
  - always
- name: Load mandatory site-policy configuration
  no_log: true
  ansible.builtin.include_vars:
    file: "{{ cis_site_policy_file | default(playbook_dir ~ '/../config/cis_unix_team_inputs.yml') }}"
  tags:
  - always
- name: Display loaded execution configuration
  ansible.builtin.debug:
    msg:
      policy_file: "{{ cis_site_policy_file | default(playbook_dir ~ '/../config/cis_unix_team_inputs.yml') }}"
      requested_ids: '{{ cis_requested_control_ids | default([]) }}'
      requested_ids_type: '{{ cis_requested_control_ids | default([]) | type_debug }}'
      firewall_backend: '{{ cis_firewall_backend | default(''UNDEFINED'') }}'
  tags:
  - always
- name: Normalize journal rotation values from the single site-policy file
  ansible.builtin.set_fact:
    cis_journald_rotation: |-
      {{ cis_journald_rotation | default({
          'SystemMaxUse': cis_journald_system_max_use | default(''),
          'SystemKeepFree': cis_journald_system_keep_free | default(''),
          'RuntimeMaxUse': cis_journald_runtime_max_use | default(''),
          'RuntimeKeepFree': cis_journald_runtime_keep_free | default(''),
          'MaxFileSec': cis_journald_max_file_sec | default('')
      }) }}
  tags:
  - always
- name: Expose normalized rotation values to existing validator environment
  ansible.builtin.set_fact:
    cis_journald_system_max_use: '{{ cis_journald_rotation.get(''SystemMaxUse'', '''') }}'
    cis_journald_system_keep_free: '{{ cis_journald_rotation.get(''SystemKeepFree'', '''') }}'
    cis_journald_runtime_max_use: '{{ cis_journald_rotation.get(''RuntimeMaxUse'', '''') }}'
    cis_journald_runtime_keep_free: '{{ cis_journald_rotation.get(''RuntimeKeepFree'', '''') }}'
    cis_journald_max_file_sec: '{{ cis_journald_rotation.get(''MaxFileSec'', '''') }}'
  tags:
  - always
- name: Validate standardized CIS role input
  ansible.builtin.assert:
    that:
    - cis_operation in ['validate', 'remediate']
    - cis_phase | string in ['all', '01', '02', '03', '04', '05', '06', '07']
    - cis_ipv6_policy in ['review', 'enabled', 'disabled']
    - cis_firewall_backend in ['review', 'disabled', 'firewalld', 'nftables']
    - cis_logging_backend in ['review', 'journald', 'rsyslog']
    - ansible_facts.distribution == 'RedHat'
    - ansible_facts.distribution_major_version == '9'
    fail_msg: Use cis_operation=validate|remediate, cis_phase=all|01-07, cis_ipv6_policy=review|enabled|disabled,
      cis_firewall_backend=review|disabled|firewalld|nftables, cis_logging_backend=review|journald|rsyslog, and
      target RHEL 9.
  tags:
  - always
- name: Load validation definitions
  ansible.builtin.include_vars:
    file: '{{ role_path }}/vars/validators.yml'
    name: cis_validator_catalog
  tags:
  - always
- name: Load collection rule capabilities
  ansible.builtin.include_vars:
    file: '{{ role_path }}/vars/disable_all.yml'
    name: cis_collection_rule_defaults
  tags:
  - always
- name: Read supplied checkpoint inventory
  community.general.read_csv:
    path: '{{ role_path }}/files/checkpoints.csv'
  register: cis_checkpoint_inventory
  delegate_to: localhost
  become: false
  run_once: true
  tags:
  - always
- name: Build normalized checkpoint control ID list
  ansible.builtin.set_fact:
    cis_checkpoint_control_ids: |-
      {{
        cis_checkpoint_inventory.list
        | map(attribute='rule')
        | map('string')
        | map('trim')
        | list
      }}
  tags:
  - always
- name: Normalize configured exclusion control IDs
  ansible.builtin.set_fact:
    cis_excluded_control_ids_normalized: |-
      {{
        cis_excluded_control_ids
        | default([])
        | map('string')
        | map('trim')
        | unique
        | list
      }}
  tags:
  - always
- name: Identify exclusions not present in checkpoint inventory
  ansible.builtin.set_fact:
    cis_unknown_excluded_control_ids: |-
      {{
        cis_excluded_control_ids_normalized
        | difference(cis_checkpoint_control_ids)
        | list
      }}
  tags:
  - always
- name: Report exclusions not present in checkpoint inventory
  ansible.builtin.debug:
    msg: 'These excluded control IDs are not present in files/checkpoints.csv and therefore are already outside
      this role''s scope: {{ cis_unknown_excluded_control_ids | join('', '') }}'
  when: cis_unknown_excluded_control_ids | length > 0
  tags:
  - always
- name: Build effective exclusion list
  ansible.builtin.set_fact:
    cis_effective_excluded_control_ids: |-
      {{
        cis_excluded_control_ids_normalized
        | intersect(cis_checkpoint_control_ids)
        | list
      }}
  tags:
  - always
- name: Initialize selected checkpoint list
  ansible.builtin.set_fact:
    cis_selected_checkpoints: []
    cis_remediation_capable_ids: []
    cis_custom_supported_ids:
    - 1.1.1.9
    - 1.3.1.2
    - 1.4.1
    - 1.4.2
    - 2.4.1.8
    - 3.1.1
    - 4.1.1
    - 4.3.1
    - 4.3.2
    - 4.3.3
    - 5.1.9
    - 5.3.1.3
    - 5.3.2.1
    - 5.3.2.2
    - 5.3.2.4
    - 5.3.3.3.3
    - 5.3.3.4.1
    - 5.4.2.5
    - 5.4.1.3
    - 6.1.2
    - 7.1.11
    - 7.2.3
    - 1.2.1.1
    - 1.2.1.4
    - 6.2.1.2
    - 6.2.1.3
    - 6.2.2.1.2
    - 6.2.3.8
    - 5.1.8
    - 6.2.3.5
    - 6.2.3.6
    - 6.2.4.1
    - 7.1.13
    - 1.1.2.1.4
    - 2.4.1.7
    - 5.3.3.2.7
    - 5.3.3.3.2
    - 6.1.3
    - 7.2.9
    - 1.7.3
    - 5.3.3.2.1
    - 5.3.3.2.4
    - 5.3.3.2.5
    - 5.1.20
  tags:
  - always
- name: Display formally excluded CIS controls
  ansible.builtin.debug:
    msg:
      excluded_control_ids: '{{ cis_excluded_control_ids | default([]) }}'
      exclusion_approved_by: '{{ cis_exclusion_approved_by | default(''NOT_PROVIDED'') }}'
      exclusion_reference: '{{ cis_exclusion_reference | default(''NOT_PROVIDED'') }}'
      exclusion_reason: '{{ cis_exclusion_reason | default(''NOT_PROVIDED'') }}'
  when: cis_excluded_control_ids | default([]) | length > 0
  tags:
  - always
- name: Select requested checkpoints excluding formally approved exclusions
  ansible.builtin.set_fact:
    cis_selected_checkpoints: '{{ cis_selected_checkpoints + [item] }}'
  loop: '{{ cis_checkpoint_inventory.list }}'
  loop_control:
    label: '{{ item.rule }}'
  when:
  - cis_phase == 'all' or item.rule.split('.')[0] == (cis_phase | int | string)
  - (item.rule | string | trim) not in (cis_effective_excluded_control_ids | default([]))
  - (cis_requested_control_ids | default([]) | length == 0) or ((item.rule | string | trim) in cis_requested_control_ids)
  tags:
  - always
- name: Build selected and collection-supported control ID lists
  ansible.builtin.set_fact:
    cis_selected_control_ids: |-
      {{
        cis_selected_checkpoints
        | map(attribute='rule')
        | map('string')
        | map('trim')
        | list
      }}
    cis_collection_supported_ids: |-
      {{
        cis_collection_rule_defaults
        | dict2items
        | map(attribute='key')
        | select('match', '^rhel9cis_rule_[0-9_]+_enabled$')
        | map('regex_replace', '^rhel9cis_rule_', '')
        | map('regex_replace', '_enabled$', '')
        | map('replace', '_', '.')
        | list
      }}
  tags:
  - always
- name: Identify remediation-capable selected controls
  ansible.builtin.set_fact:
    cis_remediation_capable_ids: |-
      {{
        cis_selected_control_ids
        | intersect(
            (
              cis_collection_supported_ids
              + cis_custom_supported_ids
            )
            | unique
            | list
          )
        | list
      }}
  tags:
  - always
- name: Run read-only pre-validation
  ansible.builtin.include_tasks: validation.yml
  vars:
    cis_validation_stage: pre
  tags:
  - always
- name: Save pre-validation results
  ansible.builtin.set_fact:
    cis_remediation_errors: []
    cis_pre_validation_results: '{{ cis_validation_results }}'
    cis_noncompliant_ids: |-
      {{
        cis_validation_results
        | selectattr('status', 'equalto', 'NON_COMPLIANT')
        | map(attribute='control_id')
        | list
      }}
    cis_remediation_attempted_ids: []
    cis_remediation_blocked: []
  tags:
  - always
- name: Identify firewall controls blocked by site backend policy
  ansible.builtin.set_fact:
    cis_firewall_policy_skip_ids: |-
      {{ cis_selected_control_ids | select('match', '^4[.]') | list
         if cis_firewall_backend in ['disabled', 'review']
         else (['4.3.1', '4.3.2', '4.3.3', '4.3.4']
               if cis_firewall_backend == 'firewalld'
               else ['4.2.1', '4.2.2']) }}
  tags:
  - always
- name: Select non-compliant controls supported for automatic remediation
  ansible.builtin.set_fact:
    cis_remediation_ids: |-
      {{ cis_noncompliant_ids
         | intersect(cis_remediation_capable_ids)
         | difference(cis_remediation_skip_ids | default([]))
         | difference(cis_firewall_policy_skip_ids)
         | difference(['3.1.1'] if cis_ipv6_policy != 'disabled' else [])
         | list }}
    cis_policy_skipped_ids: |-
      {{ cis_noncompliant_ids
         | intersect((cis_remediation_skip_ids | default([]))
                     + cis_firewall_policy_skip_ids)
         | unique | list }}
  tags:
  - always
- name: Split effective remediation IDs by implementation
  ansible.builtin.set_fact:
    cis_collection_remediation_ids: '{{ cis_remediation_ids | difference(cis_custom_supported_ids) | list }}'
    cis_custom_remediation_ids: '{{ cis_remediation_ids | intersect(cis_custom_supported_ids) | list }}'
  tags:
  - always
- name: Display selected remediation controls
  ansible.builtin.debug:
    msg:
      all_remediation_ids: '{{ cis_remediation_ids }}'
      collection_remediation_ids: '{{ cis_collection_remediation_ids }}'
      custom_remediation_ids: '{{ cis_custom_remediation_ids }}'
      remediation_skipped_by_policy: '{{ cis_policy_skipped_ids }}'
  when: cis_operation == 'remediate'
  tags:
  - always
- name: Emit pre-validation report payload
  ansible.builtin.debug:
    msg:
      cis_report_payload:
        stage: pre
        operation: '{{ cis_operation }}'
        host: '{{ inventory_hostname }}'
        results: '{{ cis_pre_validation_results }}'
        remediation_attempted: []
        connection_address: '{{ ansible_host | default('''') }}'
        default_ipv4: '{{ ansible_facts.default_ipv4.address | default('''') }}'
        hostname: '{{ ansible_facts.hostname | default(inventory_hostname) }}'
  tags:
  - always
- name: Initialize original-file ledger once per host in this playbook execution
  ansible.builtin.set_fact:
    cis_run_file_backups: []
  tags:
  - always
  when: cis_run_file_backups is not defined
- name: Run remediation workflow
  when:
  - cis_operation == 'remediate'
  - cis_remediation_ids | length > 0
  tags:
  - always
  module_defaults:
    ansible.builtin.copy:
      backup: false
    ansible.builtin.template:
      backup: false
    ansible.builtin.lineinfile:
      backup: false
    ansible.builtin.blockinfile:
      backup: false
    ansible.builtin.replace:
      backup: false
    ansible.builtin.cron:
      backup: false
    ansible.builtin.find:
      excludes:
      - backup_CIS_remediation_*
      - '*-backup_CIS_remediation_*'
      - .cis_prechange_*
  block:
  - name: Apply each selected remediation independently
    ansible.builtin.include_tasks: remediate_one.yml
    loop: '{{ cis_selected_control_ids | select(''in'', cis_remediation_ids) | list }}'
    loop_control:
      loop_var: cis_dispatch_control_id
      label: '{{ cis_dispatch_control_id }}'
  - name: Emit remediation-attempt report payload
    ansible.builtin.debug:
      msg:
        cis_report_payload:
          stage: remediation
          operation: '{{ cis_operation }}'
          host: '{{ inventory_hostname }}'
          results: '{{ cis_pre_validation_results }}'
          remediation_attempted: '{{ cis_remediation_attempted_ids | default([]) }}'
          remediation_errors: '{{ cis_remediation_errors | default([]) }}'
          connection_address: '{{ ansible_host | default('''') }}'
          default_ipv4: '{{ ansible_facts.default_ipv4.address | default('''') }}'
          hostname: '{{ ansible_facts.hostname | default(inventory_hostname) }}'
          remediation_blocked: '{{ cis_remediation_blocked | default([]) }}'
- name: Run MSB recovery before final validation
  when:
  - cis_operation == 'remediate'
  - cis_remediation_ids | default([]) | length > 0
  - cis_msb_post_remediation_enabled | default(false) | bool
  - not (cis_msb_post_remediation_done | default(false) | bool)
  - not ansible_check_mode
  tags:
  - always
  block:
  - name: Run Unix-team MSB post-remediation workflow
    ansible.builtin.include_tasks:
      file: post_remediation_msb.yml
      apply:
        become: true
        tags:
        - always
  rescue:
  - name: Record sanitized MSB failure
    ansible.builtin.set_fact:
      cis_msb_status: FAILED
      cis_msb_output: MSB workflow failed; review the failed task and recovery location. No automatic rollback attempted.
  - name: Stop this host after MSB failure
    ansible.builtin.fail:
      msg: MSB workflow failed. Review the report and recovery backup before retrying.
    when: not (cis_continue_on_remediation_error | default(true) | bool)
  - name: Continue post-validation after recorded MSB failure
    ansible.builtin.debug:
      msg: MSB failed; its result is retained in evidence JSON. Continuing read-only post-validation.
    when: cis_continue_on_remediation_error | default(true) | bool
- name: Run read-only post-validation
  ansible.builtin.include_tasks: validation.yml
  vars:
    cis_validation_stage: post
    cis_selected_checkpoints: |-
      {{
        cis_checkpoint_inventory.list
        | selectattr('rule', 'in', cis_remediation_ids)
        | list
      }}
  when: cis_operation == 'remediate'
  tags:
  - always
- name: Save post-validation results
  ansible.builtin.set_fact:
    cis_post_validation_results: '{{ cis_validation_results if cis_operation == ''remediate'' else [] }}'
  tags:
  - always
- name: Identify unresolved post-remediation controls
  ansible.builtin.set_fact:
    cis_unresolved_post_results: |-
      {{ cis_post_validation_results
         | rejectattr('status', 'equalto', 'COMPLIANT')
         | rejectattr(
             'control_id',
             'in',
             cis_remediation_skip_ids | default([])
           )
         | list }}
  when: cis_operation == 'remediate'
  tags:
  - always
- name: RHEL9_CIS_REPORT_FINAL | Emit final structured results
  ansible.builtin.debug:
    msg:
      cis_report_payload:
        stage: final
        operation: '{{ cis_operation }}'
        host: '{{ inventory_hostname }}'
        results: '{{ cis_pre_validation_results }}'
        post_results: '{{ cis_post_validation_results }}'
        remediation_attempted: '{{ cis_remediation_attempted_ids | default([]) }}'
        remediation_skipped_by_policy: '{{ cis_policy_skipped_ids }}'
        excluded_control_ids: '{{ cis_excluded_control_ids | default([]) }}'
        exclusion_approved_by: '{{ cis_exclusion_approved_by | default(''NOT_PROVIDED'') }}'
        exclusion_reference: '{{ cis_exclusion_reference | default(''NOT_PROVIDED'') }}'
        exclusion_reason: '{{ cis_exclusion_reason | default(''NOT_PROVIDED'') }}'
        remediation_errors: '{{ cis_remediation_errors | default([]) }}'
        remediation_skip_reasons:
          configured_skip_ids: '{{ cis_remediation_skip_ids | default([]) }}'
          firewall_policy_skip_ids: '{{ cis_firewall_policy_skip_ids }}'
          firewall_reason: Firewall remediation skipped by configured site backend policy; no Security exception
            inferred.
        connection_address: '{{ ansible_host | default('''') }}'
        default_ipv4: '{{ ansible_facts.default_ipv4.address | default('''') }}'
        hostname: '{{ ansible_facts.hostname | default(inventory_hostname) }}'
        msb_status: '{{ cis_msb_status | default(''NOT_RUN'') }}'
        msb_output: '{{ cis_msb_output | default('''') }}'
        msb_backup_details: '{{ cis_msb_backup_details | default('''') }}'
        remediation_blocked: '{{ cis_remediation_blocked | default([]) }}'
  tags:
  - always
- name: Fail remediation run when in-scope controls remain unresolved
  ansible.builtin.assert:
    that:
    - cis_unresolved_post_results | length == 0
    fail_msg: 'Remediation tasks finished, but post-validation still reports unresolved controls: {{ cis_unresolved_post_results
      | map(attribute=''control_id'') | list }}. Review each control row and the matching evidence JSON. Some controls
      require approved listener, ownership, or group decisions; do not treat missing site decisions as successful
      remediation.'
  when:
  - cis_operation == 'remediate'
  - cis_fail_remediation_when_unresolved | bool
  - not (cis_continue_on_remediation_error | default(true) | bool)
  tags:
  - always
- name: Summarize remediation findings without stopping the run
  ansible.builtin.debug:
    msg:
      failed_controls: '{{ cis_remediation_errors | default([]) | map(attribute=''control_id'') | unique | list
        }}'
      blocked_controls: '{{ cis_remediation_blocked | default([]) }}'
      unresolved_controls: '{{ cis_unresolved_post_results | default([]) | map(attribute=''control_id'') | list
        }}'
      note: Execution continued as configured. Failed, blocked, or unresolved controls are not compliant; review
        CSV and evidence JSON.
  when:
  - cis_operation == 'remediate'
  - cis_continue_on_remediation_error | default(true) | bool
  tags:
  - always
