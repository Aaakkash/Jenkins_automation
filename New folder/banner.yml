---
- name: Inspect duplicate static SSH banner display
  become: true
  block:
    - name: Read effective SSH banner settings
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -f
          - '{{ cis_sshd_config_file | default("/etc/ssh/sshd_config") }}'
      register: cis_banner_effective
      changed_when: false
    - name: Identify effective SSH banner path
      ansible.builtin.set_fact:
        cis_banner_effective_path: '{{ (cis_banner_effective.stdout_lines | select("match", "^banner ") | list | first | default("banner none")) | regex_replace("^banner ", "") }}'
    - name: Inspect static MOTD and SSH PAM files
      ansible.builtin.stat:
        path: '{{ item }}'
        get_checksum: false
        get_mime: false
      loop:
        - /etc/motd
        - /etc/pam.d/sshd
        - '{{ cis_banner_effective_path }}'
      register: cis_banner_files
      when: cis_banner_effective_path.startswith('/')
    - name: Compare existing static banner and MOTD
      when:
        - cis_banner_effective_path.startswith('/')
        - cis_banner_files.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | list | length == 3
      block:
        - name: Read static warning and PAM content for comparison
          ansible.builtin.slurp:
            src: '{{ item }}'
          loop:
            - '{{ cis_banner_effective_path }}'
            - /etc/motd
            - /etc/pam.d/sshd
          register: cis_banner_content
          no_log: true
        - name: Clean up only identical nonempty static warnings with an unconfigured optional pam_motd line
          ansible.builtin.include_tasks: remediate_report_gaps.yml
          vars:
            cis_remediation_control_id: '5.1.8'
            cis_custom_remediation_ids: ['5.1.8']
            cis_collection_remediation_ids: []
            cis_duplicate_banner_cleanup_only: true
          when:
            - cis_banner_content.results[0].content | b64decode | trim | length > 0
            - (cis_banner_content.results[0].content | b64decode | trim) == (cis_banner_content.results[1].content | b64decode | trim)
            - (cis_banner_content.results[2].content | b64decode) is search('(?m)^[ \t]*session[ \t]+optional[ \t]+pam_motd\.so[ \t]*$')
  rescue:
    - name: Record duplicate-banner inspection failure without stopping other results
      ansible.builtin.set_fact:
        cis_remediation_errors: '{{ (cis_remediation_errors | default([])) + [{"control_id": "5.1.8", "task": "Duplicate SSH banner inspection", "message": ansible_failed_result.msg | default("Inspection failed"), "rc": ansible_failed_result.rc | default("not returned")}] }}'
    - name: Honor existing fail-fast configuration
      ansible.builtin.fail:
        msg: Duplicate SSH banner inspection failed. Review recorded evidence.
      when: not (cis_continue_on_remediation_error | default(true) | bool)
